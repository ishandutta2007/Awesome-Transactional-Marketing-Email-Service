<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#311042"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Animated Grid Pattern background element -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.5" stroke-opacity="0.4"/>
    </pattern>

    <style>
      .title { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; font-size: 38px; fill: url(#textGrad); }
      .subtitle { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 400; font-size: 19px; fill: #94a3b8; }
      .badge-text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 600; font-size: 14px; fill: #e2e8f0; }

      @keyframes pulse {
        0% { transform: scale(1); opacity: 0.3; }
        50% { transform: scale(1.08); opacity: 0.6; }
        100% { transform: scale(1); opacity: 0.3; }
      }
      @keyframes float {
        0% { transform: translateY(0px); }
        50% { transform: translateY(-10px); }
        100% { transform: translateY(0px); }
      }
      @keyframes dash {
        to { stroke-dashoffset: -40; }
      }

      .g-pulse { animation: pulse 6s infinite ease-in-out; transform-origin: center; }
      .g-float { animation: float 4s infinite ease-in-out; }
      .g-dash { stroke-dasharray: 8, 8; animation: dash 3s linear infinite; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="320" rx="16" fill="url(#bgGrad)"/>
  <rect width="1200" height="320" rx="16" fill="url(#grid)"/>

  <!-- Dynamic / Animated Background Orbs (Kept behind foreground text) -->
  <circle cx="1050" cy="80" r="160" fill="url(#accentGrad)" opacity="0.25" class="g-pulse"/>
  <circle cx="150" cy="260" r="140" fill="#3b82f6" opacity="0.15" class="g-pulse" style="animation-delay: -2s;"/>

  <!-- Decorative Animated Flow Connection Lines in background -->
  <path d="M 800 240 Q 950 120 1100 220" stroke="#818cf8" stroke-width="2" fill="none" opacity="0.4" class="g-dash"/>
  <path d="M 750 80 Q 900 200 1050 90" stroke="#f43f5e" stroke-width="2" fill="none" opacity="0.3" class="g-dash" style="animation-direction: reverse;"/>

  <!-- Background Animated Pill Cards (Positioned far right, behind text z-index safe zone) -->
  <g class="g-float" transform="translate(820, 70)">
    <rect width="280" height="60" rx="12" fill="#1e293b" stroke="#475569" stroke-width="1" opacity="0.85"/>
    <text x="20" y="36" class="badge-text">&#9889; High-Speed SMTP &amp; REST APIs</text>
  </g>

  <g class="g-float" transform="translate(860, 150)" style="animation-delay: -1.5s;">
    <rect width="260" height="60" rx="12" fill="#1e293b" stroke="#475569" stroke-width="1" opacity="0.85"/>
    <text x="20" y="36" class="badge-text">&#128274; Open-Source &amp; Self-Hosted</text>
  </g>

  <g class="g-float" transform="translate(800, 220)" style="animation-delay: -3s;">
    <rect width="270" height="50" rx="12" fill="#1e293b" stroke="#475569" stroke-width="1" opacity="0.85"/>
    <text x="20" y="30" class="badge-text">&#128202; Deliverability &amp; Analytics</text>
  </g>

  <!-- Foreground Content (Guaranteed crisp and unobstructed) -->
  <g transform="translate(70, 110)">
    <!-- Email Icon Container -->
    <g transform="translate(0, -45)">
      <rect width="56" height="56" rx="14" fill="url(#textGrad)"/>
      <path d="M16 20 L28 30 L40 20 M16 20 L16 36 L40 36 L40 20 Z" stroke="#0f172a" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Main Title -->
    <text x="76" y="-5" class="title">Awesome Transactional &amp; Marketing Email</text>

    <!-- Subtitle -->
    <text x="0" y="45" class="subtitle">A curated directory of enterprise SaaS email APIs &amp; top open-source email engines</text>
    <text x="0" y="75" class="subtitle" style="font-size: 16px; fill: #64748b;">Market intelligence &#8226; Revenue &amp; Valuation insights &#8226; Star-ranked Open Source stacks</text>
  </g>

</svg>
