<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 320"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0f172a"/><stop offset="50%" stop-color="#1e1b4b"/><stop offset="100%" stop-color="#311042"/></linearGradient><linearGradient id="textGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="50%" stop-color="#818cf8"/><stop offset="100%" stop-color="#c084fc"/></linearGradient><linearGradient id="accentGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#f43f5e" stop-opacity=".8"/><stop offset="100%" stop-color="#8b5cf6" stop-opacity=".8"/></linearGradient><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path fill="none" stroke="#334155" stroke-opacity=".4" stroke-width=".5" d="M 40 0 L 0 0 0 40"/></pattern><style>@keyframes pulse{0%{transform:scale(1);opacity:.3}50%{transform:scale(1.08);opacity:.6}}@keyframes float{0%{transform:translateY(0)}50%{transform:translateY(-10px)}}.badge-text,.subtitle,.title{font-family:system-ui,-apple-system,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif}.title{font-weight:800;font-size:38px;fill:url(#textGrad)}.subtitle{font-weight:400;font-size:19px;fill:#94a3b8}.badge-text{font-weight:600;font-size:14px;fill:#e2e8f0}.g-pulse{animation:pulse 6s infinite ease-in-out;transform-origin:center}.g-float{animation:float 4s infinite ease-in-out}.g-dash{stroke-dasharray:8,8;animation:dash 3s linear infinite}</style></defs><rect width="1200" height="320" fill="url(#bgGrad)" rx="16"/><rect width="1200" height="320" fill="url(#grid)" rx="16"/><circle cx="1050" cy="80" r="160" fill="url(#accentGrad)" class="g-pulse" opacity=".25"/><circle cx="150" cy="260" r="140" fill="#3b82f6" class="g-pulse" opacity=".15" style="animation-delay:-2s"/><path fill="none" stroke="#818cf8" stroke-width="2" d="M 800 240 Q 950 120 1100 220" class="g-dash" opacity=".4"/><path fill="none" stroke="#f43f5e" stroke-width="2" d="M 750 80 Q 900 200 1050 90" class="g-dash" opacity=".3" style="animation-direction:reverse"/><g class="g-float" transform="translate(820, 70)"><rect width="280" height="60" fill="#1e293b" stroke="#475569" stroke-width="1" opacity=".85" rx="12"/><text x="20" y="36" class="badge-text">⚡ High-Speed SMTP &amp; REST APIs</text></g><g class="g-float" transform="translate(860, 150)" style="animation-delay:-1.5s"><rect width="260" height="60" fill="#1e293b" stroke="#475569" stroke-width="1" opacity=".85" rx="12"/><text x="20" y="36" class="badge-text">🔒 Open-Source &amp; Self-Hosted</text></g><g class="g-float" transform="translate(800, 220)" style="animation-delay:-3s"><rect width="270" height="50" fill="#1e293b" stroke="#475569" stroke-width="1" opacity=".85" rx="12"/><text x="20" y="30" class="badge-text">📊 Deliverability &amp; Analytics</text></g><g><g transform="translate(70, 110) translate(0, -45)"><rect width="56" height="56" fill="url(#textGrad)" rx="14"/><path fill="none" stroke="#0f172a" stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M16 20 L28 30 L40 20 M16 20 L16 36 L40 36 L40 20 Z"/></g><text x="76" y="-5" class="title" transform="translate(70, 110)">Awesome Transactional &amp; Marketing Email</text><text x="0" y="45" class="subtitle" transform="translate(70, 110)">A curated directory of enterprise SaaS email APIs &amp; top open-source email engines</text><text x="0" y="75" class="subtitle" style="font-size:16px;fill:#64748b" transform="translate(70, 110)">Market intelligence • Revenue &amp; Valuation insights • Star-ranked Open Source stacks</text></g></svg>